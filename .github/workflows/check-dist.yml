name: Check dist

# The action runs the committed dist/index.js as-is, so it must always be
# rebuilt from src/ and committed. This workflow fails if dist/ is stale.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/check-dist.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/check-dist.yml'
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist
        run: npm run build

      - name: Compare committed dist with rebuild
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "Committed dist/ is out of date. Run 'npm run build' and commit the changes." >&2
            git --no-pager diff --stat -- dist/
            exit 1
          fi
          echo "dist/ is up to date."

      # Upload the rebuilt dist on failure to aid debugging.
      - name: Upload rebuilt dist
        if: failure() && steps.diff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
